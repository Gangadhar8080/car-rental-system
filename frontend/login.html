<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | DriveEasy Car Rentals</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<nav class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo">🚗 DriveEasy</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="cars.html">Cars</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions" id="navActions"></div>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="subtitle">Log in to manage your bookings.</p>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
    <div class="divider"></div>
    <p class="helper-text text-center">
      Demo: admin@carrental.com / Admin@123 &nbsp;·&nbsp; user@carrental.com / User@123
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/animations.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
