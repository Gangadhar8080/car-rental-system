<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile | DriveEasy Car Rentals</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<nav class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo">🚗 DriveEasy</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="cars.html">Cars</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
    <div class="nav-actions" id="navActions"></div>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</nav>

<div class="container section">
  <div class="dash-layout">
    <aside class="dash-sidebar">
      <a href="dashboard.html">🏠 Overview</a>
      <a href="bookings.html">📖 My Bookings</a>
      <a href="profile.html" class="active">👤 Profile</a>
      <a href="cars.html">🚗 Browse Cars</a>
    </aside>

    <main class="dash-main">
      <h1 class="mb-24">My Profile</h1>

      <div class="card mb-24">
        <div class="flex gap-16" style="align-items:center;">
          <div class="avatar-circle" id="avatarInitials">--</div>
          <div>
            <p class="text-muted">Account Role</p>
            <h3 id="role">User</h3>
          </div>
        </div>
      </div>

      <div class="card profile-form mb-24">
        <h3 class="mb-16">Personal Information</h3>
        <form id="profileForm" class="auth-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" disabled style="background:#f2f3f2;" />
            <span class="helper-text">Email cannot be changed.</span>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required />
          </div>
          <div class="form-group">
            <label for="drivingLicenseNumber">Driving License Number</label>
            <input type="text" id="drivingLicenseNumber" required />
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>

      <div class="card profile-form">
        <h3 class="mb-16">Change Password</h3>
        <form id="passwordForm" class="auth-form">
          <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" required />
          </div>
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required minlength="6" />
          </div>
          <div class="form-group">
            <label for="confirmNewPassword">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-outline">Update Password</button>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/animations.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
