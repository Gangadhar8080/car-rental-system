<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Cars | DriveEasy Admin</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/animations.css" />
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">🚗 DriveEasy Admin</div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="cars.html" class="active">🚘 Manage Cars</a>
    <a href="bookings.html">📖 Manage Bookings</a>
    <a href="users.html">👥 Manage Users</a>
    <a href="maintenance.html">🔧 Maintenance</a>
    <div class="section-label">Account</div>
    <a href="../index.html">🏠 Back to Site</a>
    <a href="#" id="adminLogoutBtn">🚪 Logout</a>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="flex gap-12" style="align-items:center;">
        <button class="admin-mobile-toggle">☰</button>
        <h1>Manage Cars</h1>
      </div>
      <button class="btn btn-primary" onclick="openAddCarModal()">+ Add Car</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Image</th><th>Car</th><th>Year</th><th>Price/Day</th><th>Status</th><th>Location</th><th>Actions</th></tr>
        </thead>
        <tbody id="adminCarsTableBody">
          <tr><td colspan="7"><div class="spinner"></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add/Edit Car Modal -->
<div class="modal-overlay" id="carModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="carModalTitle">Add New Car</h3>
      <button class="modal-close" onclick="closeCarModal()">&times;</button>
    </div>
    <form id="carForm">
      <div class="form-row-2 mb-16" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group"><label>Brand</label><input type="text" id="cf_brand" required /></div>
        <div class="form-group"><label>Model</label><input type="text" id="cf_model" required /></div>
      </div>
      <div class="form-row-2 mb-16" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group"><label>Year</label><input type="number" id="cf_year" min="1990" max="2027" required /></div>
        <div class="form-group"><label>Price / Day (₹)</label><input type="number" id="cf_pricePerDay" min="0" required /></div>
      </div>
      <div class="form-row-2 mb-16" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group"><label>Fuel Type</label>
          <select id="cf_fuelType" required>
            <option>Petrol</option><option>Diesel</option><option>Electric</option><option>Hybrid</option><option>CNG</option>
          </select>
        </div>
        <div class="form-group"><label>Transmission</label>
          <select id="cf_transmission" required><option>Automatic</option><option>Manual</option></select>
        </div>
      </div>
      <div class="form-row-2 mb-16" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group"><label>Seats</label><input type="number" id="cf_seats" min="1" max="20" required /></div>
        <div class="form-group"><label>Mileage</label><input type="text" id="cf_mileage" placeholder="e.g. 18 km/l" /></div>
      </div>
      <div class="form-group mb-16"><label>Location</label><input type="text" id="cf_location" required /></div>
      <div class="form-group mb-16"><label>Description</label><textarea id="cf_description" rows="3"></textarea></div>
      <div class="form-group mb-16"><label>Features (comma separated)</label><input type="text" id="cf_features" placeholder="Air Conditioning, Bluetooth, GPS" /></div>
      <div class="form-group mb-16"><label>Image URLs (comma separated)</label><input type="text" id="cf_images" placeholder="https://..." /></div>
      <button type="submit" class="btn btn-primary btn-block">Save Car</button>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/animations.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script>
  qs('#adminLogoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    Storage.clearAll();
    window.location.href = '../index.html';
  });
</script>
</body>
</html>
